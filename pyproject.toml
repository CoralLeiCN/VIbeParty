[project]
name = "vibeparty"
version = "0.1.0"
description = "Local multiplayer video party games"
requires-python = ">=3.13,<3.14"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "uvicorn>=0.34,<1", "httpx>=0.28,<1"]

[project.optional-dependencies]
live = [
    "reactor-sdk==1.5.1",
    "tokenizers==0.23.2",
]
scoring = [
    "huggingface-hub==1.31.0",
    "numpy==2.5.3",
    "sentence-transformers==6.0.1",
    "torch==2.14.0",
    "transformers==5.17.0",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
